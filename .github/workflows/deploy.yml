name: Deploy backend to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  # The App Service resource name, used for the deploy step.
  AZURE_WEBAPP_NAME: pdf-intelligence-api
  # The public hostname, used for the post-deploy readiness check. Azure now
  # appends a unique suffix and a regional segment, so this is NOT simply
  # "<name>.azurewebsites.net" — copy it from the portal's Essentials panel.
  AZURE_WEBAPP_HOSTNAME: pdf-intelligence-api-bccedkabcaczf4er.centralindia-01.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Dependencies are installed into the deployment payload rather than
      # relying on App Service's Oryx build. It makes the deployed artifact
      # exactly what CI tested, and removes a slow, opaque build step from the
      # critical path of every deploy.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Compile-check sources
        run: python -m compileall -q app

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      # The app is only genuinely deployed once it can reach the database.
      # /health/ready runs a real query, so this catches a broken connection
      # string before anyone opens the site.
      - name: Verify readiness
        run: |
          for attempt in {1..12}; do
            if curl -fsS "https://${{ env.AZURE_WEBAPP_HOSTNAME }}/health/ready"; then
              echo "  <- ready"
              exit 0
            fi
            echo "not ready yet (attempt $attempt), waiting…"
            sleep 10
          done
          echo "Readiness check failed after 2 minutes."
          exit 1
