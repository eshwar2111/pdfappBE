name: Deploy backend to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  # The App Service resource name, used for the deploy step.
  AZURE_WEBAPP_NAME: pdf-intelligence-api
  # The public hostname, used for the post-deploy readiness check. Azure now
  # appends a unique suffix and a regional segment, so this is NOT simply
  # "<name>.azurewebsites.net" — copy it from the portal's Essentials panel.
  AZURE_WEBAPP_HOSTNAME: pdf-intelligence-api-bccedkabcaczf4er.centralindia-01.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Syntax check only — compileall needs no third-party packages, so this
      # catches a broken file in seconds without installing anything.
      #
      # Dependencies are deliberately NOT vendored into the payload: App
      # Service Linux builds Python apps with Oryx, which creates and activates
      # an `antenv` virtualenv from requirements.txt on the server. Shipping a
      # pre-populated .python_packages directory is the Azure *Functions*
      # convention; App Service ignores it, and the app starts with nothing
      # importable. That requires SCM_DO_BUILD_DURING_DEPLOYMENT=true.
      - name: Compile-check sources
        run: python -m compileall -q app

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      # The app is only genuinely deployed once it can reach the database.
      # /health/ready runs a real query, so this catches a broken connection
      # string before anyone opens the site.
      #
      # The window is generous because Oryx builds on the server: it installs
      # every dependency, then the startup command runs migrations before
      # gunicorn binds a port. A cold first deploy can take several minutes.
      - name: Verify readiness
        run: |
          for attempt in {1..30}; do
            if curl -fsS "https://${{ env.AZURE_WEBAPP_HOSTNAME }}/health/ready"; then
              echo "  <- ready"
              exit 0
            fi
            echo "not ready yet (attempt $attempt), waiting…"
            sleep 20
          done
          echo "Readiness check failed after 10 minutes."
          echo "Check the App Service log stream — most likely a failed"
          echo "migration (bad DATABASE_URL) or a missing dependency."
          exit 1
